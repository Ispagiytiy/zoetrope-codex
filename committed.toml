# configuration for https://github.com/crate-ci/committed

# https://www.conventionalcommits.org
style = "conventional"
# allow merge commits, including their conventional `merge:` type
merge_commit = true
# keep the default conventional types and explicitly allow stacked merges
allowed_types = ["fix", "feat", "chore", "docs", "style", "refactor", "perf", "test", "merge"]
# subject is not required to be capitalized
subject_capitalized = false
# subject should start with an imperative verb
imperative_subject = true
# subject should not end with a punctuation
subject_not_punctuated = true
# disable line length
line_length = 0
# disable subject length
subject_length = 0
